name: CI

on:
  push:
    branches:
      - main
      - hardening-and-upgrade
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check docs and repository hygiene
        run: node scripts/check-repo-hygiene.mjs

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-environment/local-fresh-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify
        run: mvn -pl local-fresh-server -am verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend-environment/local-fresh-backend/local-fresh-server/target/site/jacoco
          if-no-files-found: error

      - name: Package backend release
        working-directory: .
        run: SKIP_VERIFY=true scripts/package-backend-release.sh

      - name: Verify backend release package
        working-directory: .
        run: scripts/verify-backend-release-package.sh output/backend-release

      - name: Upload backend release package
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-package
          path: output/backend-release
          if-no-files-found: error

  admin-frontend:
    name: Admin frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-environment/local-fresh-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-environment/local-fresh-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  user-frontend:
    name: User frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-environment/local-fresh-user
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@10.25.0 install --frozen-lockfile

      - name: Build
        run: corepack pnpm@10.25.0 run build
