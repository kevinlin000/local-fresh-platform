name: CI

on:
  push:
    branches:
      - main
      - hardening-and-upgrade
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-environment/local-fresh-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test
        run: mvn test

  admin-frontend:
    name: Admin frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-environment/local-fresh-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-environment/local-fresh-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  user-frontend:
    name: User frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-environment/local-fresh-user
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend-environment/local-fresh-user/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@10.25.0 install --frozen-lockfile

      - name: Build
        run: corepack pnpm@10.25.0 run build
