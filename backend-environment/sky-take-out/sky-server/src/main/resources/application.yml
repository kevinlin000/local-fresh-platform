server:
  port: 8080

spring:
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}

  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    database: ${sky.redis.database}


mybatis:
  # mapper 設定檔
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    # 啟用駝峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    admin-secret-key: ${sky.jwt.admin-secret-key}
    admin-ttl: 7200000000
    admin-token-name: token

    user-secret-key: ${sky.jwt.user-secret-key}
    user-ttl: 7200000000
    user-token-name: authentication

  aws:
    s3:
      region: ${sky.aws.s3.region}
      access-key-id: ${sky.aws.s3.access-key-id}
      secret-access-key: ${sky.aws.s3.secret-access-key}
      bucket-name: ${sky.aws.s3.bucket-name}

  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}

  shop:
    address: ${sky.shop.address} # 換成想要的台灣店家地址
  google:
    api-key:  ${sky.google.api-key} # 填入你的 Google API Key
  oauth:
    google:
      client-id: ${sky.oauth.google.client-id}
      client-secret: ${sky.oauth.google.client-secret}
      redirect-uri: ${sky.oauth.google.redirect-uri:http://localhost:5173/oauth/callback}
  auth:
    mock-login-enabled: ${sky.auth.mock-login-enabled:true}
  group-buy:
    expire-hours: 24
    share-base-url: http://localhost:5173/groupBuy
