spring:
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      schema-locations: classpath:schema-test.sql
      mode: always
  flyway:
    enabled: false

management:
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: warn
    com.localfresh.handler: off
    com.localfresh.mapper: warn
    com.localfresh.service: warn
    com.localfresh.controller: warn
    com.localfresh.interceptor: warn
    com.localfresh.config: warn
    io.netty.resolver.dns.DnsServerAddressStreamProviders: off
    org.springdoc: off

# Provide localfresh.* so that application.yml ${...} placeholders can resolve
localfresh:
  datasource:
    driver-class-name: org.h2.Driver
    host: localhost
    port: 9999
    database: testdb
    username: sa
    password: ""
  redis:
    host: localhost
    port: 6379
    database: 0
  jwt:
    admin-secret-key: test-admin-secret-key-32chars-pad-
    admin-ttl: 7200000000
    admin-token-name: token
    user-secret-key: test-user-secret-key-32chars-pad--
    user-ttl: 7200000000
    user-token-name: authentication
  shop:
    address: "台北市信義區市府路1號"
  delivery:
    range-check-enabled: false
  google:
    api-key: test-google-api-key
  oauth:
    google:
      client-id: test-google-client-id.apps.googleusercontent.com
      client-secret: test-google-client-secret
      redirect-uri: http://localhost:5173/oauth/callback
  auth:
    mock-login-enabled: true
  aws:
    s3:
      region: us-east-1
      access-key-id: test-key
      secret-access-key: test-secret-key
      bucket-name: test-bucket
  group-buy:
    expire-hours: 24
    share-base-url: http://localhost:5173/groupBuy
  test:
    mock-redisson: true
