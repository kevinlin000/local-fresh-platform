server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: ${localfresh.datasource.driver-class-name}
    url: jdbc:mysql://${localfresh.datasource.host}:${localfresh.datasource.port}/${localfresh.datasource.database}?serverTimezone=Asia/Taipei&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=${localfresh.datasource.use-ssl:false}&allowPublicKeyRetrieval=true
    username: ${localfresh.datasource.username}
    password: ${localfresh.datasource.password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

  redis:
    host: ${localfresh.redis.host}
    port: ${localfresh.redis.port}
    database: ${localfresh.redis.database}


mybatis:
  # mapper 設定檔
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.localfresh.entity
  configuration:
    # 啟用駝峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com.localfresh.mapper: debug
    com.localfresh.service: info
    com.localfresh.controller: info

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}

localfresh:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
  jwt:
    admin-secret-key: ${localfresh.jwt.admin-secret-key}
    admin-ttl: 7200000000
    admin-token-name: token

    user-secret-key: ${localfresh.jwt.user-secret-key}
    user-ttl: 7200000000
    user-token-name: authentication

  aws:
    s3:
      region: ${localfresh.aws.s3.region}
      access-key-id: ${localfresh.aws.s3.access-key-id}
      secret-access-key: ${localfresh.aws.s3.secret-access-key}
      bucket-name: ${localfresh.aws.s3.bucket-name}

  shop:
    address: ${localfresh.shop.address} # 換成想要的台灣店家地址
  google:
    api-key:  ${localfresh.google.api-key} # 填入你的 Google API Key
  oauth:
    google:
      client-id: ${localfresh.oauth.google.client-id}
      client-secret: ${localfresh.oauth.google.client-secret}
      redirect-uri: ${localfresh.oauth.google.redirect-uri:http://localhost:5173/oauth/callback}
  auth:
    mock-login-enabled: ${localfresh.auth.mock-login-enabled:true}
  group-buy:
    expire-hours: 24
    share-base-url: ${localfresh.group-buy.share-base-url:http://localhost:5173/groupBuy}
