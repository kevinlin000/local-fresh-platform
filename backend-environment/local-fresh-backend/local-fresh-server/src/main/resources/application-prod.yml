server:
  forward-headers-strategy: framework

spring:
  datasource:
    driver-class-name: "${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${spring.datasource.druid.driver-class-name:com.mysql.cj.jdbc.Driver}}"
    url: "${SPRING_DATASOURCE_URL:${spring.datasource.druid.url}}"
    username: "${SPRING_DATASOURCE_USERNAME:${spring.datasource.druid.username}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${spring.datasource.druid.password}}"

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.localfresh.mapper: info
    com.localfresh.service: info
    com.localfresh.controller: info

localfresh:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${DB_HOST}
    port: ${DB_PORT:3306}
    database: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    use-ssl: true
  redis:
    host: ${REDIS_HOST:${spring.redis.host:localhost}}
    port: ${REDIS_PORT:${spring.redis.port:6379}}
    database: ${REDIS_DATABASE:${spring.redis.database:0}}
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:${sky.cors.allowed-origin-patterns:http://localhost:*,http://127.0.0.1:*}}"
  auth:
    mock-login-enabled: false
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:${sky.jwt.admin-secret-key}}
    admin-ttl: ${JWT_ADMIN_TTL_MS:${sky.jwt.admin-ttl:28800000}}
    user-secret-key: ${JWT_USER_SECRET:${sky.jwt.user-secret-key}}
    user-ttl: ${JWT_USER_TTL_MS:${sky.jwt.user-ttl:604800000}}
  aws:
    s3:
      region: ${AWS_REGION:${sky.aws.s3.region}}
      access-key-id: ${AWS_ACCESS_KEY_ID:${sky.aws.s3.access-key-id}}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:${sky.aws.s3.secret-access-key}}
      bucket-name: ${S3_BUCKET_NAME:${sky.aws.s3.bucket-name}}
  google:
    api-key: ${GOOGLE_MAPS_API_KEY:${sky.google.api-key}}
  shop:
    address: ${SHOP_ADDRESS:${sky.shop.address}}
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:${sky.oauth.google.client-id}}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:${sky.oauth.google.client-secret}}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:${sky.oauth.google.redirect-uri}}
  group-buy:
    share-base-url: ${GROUP_BUY_SHARE_BASE_URL:${sky.group-buy.share-base-url}}
  payment:
    provider: ${PAYMENT_PROVIDER:demo}
    callback-secret: ${PAYMENT_CALLBACK_SECRET:local-fresh-demo-callback-secret}
    ecpay:
      merchant-id: ${ECPAY_MERCHANT_ID:}
      hash-key: ${ECPAY_HASH_KEY:}
      hash-iv: ${ECPAY_HASH_IV:}
      checkout-url: ${ECPAY_CHECKOUT_URL:https://payment.ecpay.com.tw/Cashier/AioCheckOut/V5}
      return-url: ${ECPAY_RETURN_URL:}
      order-result-url: ${ECPAY_ORDER_RESULT_URL:}
